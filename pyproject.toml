[project]
name = "grammetarl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"addict>=2.4.0",
	"easydict>=1.13",
	"einops>=0.8.2",
	"flash-attn==2.7.3",
	"img2pdf>=0.6.3",
	"jinja2>=3.1.0",
	"numpy>=2.4.6",
	"pillow>=12.3.0",
	"pyyaml>=6.0.2",
	"pydantic>=2.8.0",
	"pymupdf>=1.24.0",
	"requests>=2.32.0",
	"tokenizers==0.20.3",
	"torch==2.6.0",
	"torchaudio==2.6.0",
	"torchvision==0.21.0",
	"transformers==4.46.3",
]

[project.scripts]
grammetarl = "main:main"

# ---------------------------------------------------------------------------
# Optional RL / training stack.
#
# NOTE: verl 0.9.0 requires transformers>=5.5.3 and torch>=2.9, which CONFLICT
# with the pinned torch==2.6.0 / transformers==4.46.3 used by the OCR +
# MBG-extraction pipeline above. Do NOT install this extra into the same
# environment as the extraction pipeline. Use a dedicated RL virtualenv, e.g.:
#
#   uv venv .venv-rl --python 3.11
#   uv pip install --python .venv-rl/bin/python "verl[rollout]@0.9.0"
#   # or, for a lighter FSDP2+vLLM setup:
#   uv pip install --python .venv-rl/bin/python \
#       "verl==0.9.0" "ray[default]>=2.41.0" "hydra-core" "accelerate" \
#       "vllm>=0.18.0" "torch==2.9.1" "transformers>=5.5.3"
#
# The entrypoints in grammetarl/training/ import verl lazily, so the package
# still imports (and the extraction pipeline keeps working) without verl.
# ---------------------------------------------------------------------------
[project.optional-dependencies]
rl = [
    "verl==0.9.0",
    "ray[default]>=2.41.0",
    "hydra-core",
    "accelerate",
    "trl<=0.9.6",
    "wandb",
]
